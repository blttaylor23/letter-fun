<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LF Parent">
<meta name="robots" content="noindex">
<title>Letter Fun · Parent dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box} html,body{margin:0;background:#fff8e7;color:#222;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:calc(10px + var(--sat)) 12px calc(24px + var(--sab));max-width:900px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:8px} header h1{font-size:20px;margin:0;flex:1;color:#3a86ff}
  a.back,button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 14px;color:#fff;background:#e76f51;text-decoration:none;cursor:pointer}
  button.ok{background:#2a9d8f} button.gray{background:#999}
  .card{background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  #total{text-align:center} #total .big{font-size:46px;font-weight:800;color:#2a9d8f;letter-spacing:1px} #total .sub{color:#666;font-size:14px}
  .row3{display:flex;justify-content:space-around;gap:8px;margin-top:6px} .row3 div{text-align:center} .row3 b{display:block;font-size:20px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:84px;margin-top:10px}
  .week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:#666}
  .week i{display:block;width:70%;background:#3a86ff;border-radius:4px 4px 0 0;min-height:2px}
  .pl h2{margin:0;font-size:20px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .pl h2 small{font-size:13px;color:#777;font-weight:600}
  .pl .tag{font-size:12px;background:#999;color:#fff;border-radius:8px;padding:2px 7px}
  .kv{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0;font-size:15px} .kv span b{color:#2a9d8f}
  table{border-collapse:collapse;width:100%;font-size:14px;margin-top:4px} td{padding:3px 4px;border-top:1px solid #eee} td.v{text-align:right;font-weight:700;white-space:nowrap}
  .worst{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0} .worst span{background:#fde2e4;border-radius:10px;padding:3px 8px;font-size:14px} .worst span b{font-size:18px;margin-right:4px} .worst.hs span{background:#e3f2fd} .worst.hs span b{font-size:15px;margin:0 0 0 4px}
  h3{font-size:14px;margin:10px 0 2px;color:#555} .muted{color:#777;font-size:13px}
  details summary{cursor:pointer;color:#3a86ff;font-size:14px;margin-top:6px}
  input{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid #ccc;width:100%;margin:6px 0}
  #msg{color:#d81b60;min-height:1.3em}
</style>
</head>
<body>
<header><a class="back" href="../" aria-label="Back to the app">◀ App</a><h1>📊 Parent dashboard</h1><button id="refresh" class="ok" aria-label="Refresh">🔄</button></header>
<div id="setup" class="card" hidden>
  <p id="setupText"></p>
  <input id="pw" type="password" placeholder="Family sync password" autocomplete="current-password" autocapitalize="off">
  <input id="pw2" type="password" placeholder="Type it again" autocomplete="new-password" autocapitalize="off" hidden>
  <button id="go" class="ok">Open</button>
  <p id="msg"></p>
</div>
<div id="off" class="card" hidden><p>Family sync isn't set up yet, so each device keeps its players and stats to itself. Once it is set up and a device is linked (Settings ▸ ☁️ Family sync), its players show up here.</p></div>
<div id="dash" hidden>
  <div id="total" class="card"></div>
  <div id="players"></div>
  <div id="devices" class="card"></div>
  <p class="muted" id="upd"></p>
</div>
<script src="../sync-config.js"></script>
<script src="../sync.js"></script>
<script>
"use strict";
const S=window.LFSync, $=id=>document.getElementById(id);
const GAMES={upper:"Uppercase Test",lower:"Lowercase Test",problem:"Problem Letters",num:"Find the Number",fingers:"Count the Fingers",drawnum:"Draw the Number",drawnum_free:"Draw the Number (no guide)"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hm(ms){ const m=Math.floor((ms||0)/60000); return Math.floor(m/60)+":"+String(m%60).padStart(2,"0"); }
function hmWords(ms){ const m=Math.floor((ms||0)/60000); return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"; }
function dayKey(t){ const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function lastDays(n){ const a=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i); a.push(dayKey(d.getTime())); } return a; }
function sumDays(t,keys){ let s=0; for(const k of keys) s+=+(t.days||{})[k]||0; return s; }
function ago(t){ if(!t) return "never"; const s=Math.round((Date.now()-t)/1000); if(s<90) return "just now"; if(s<3600) return Math.round(s/60)+" min ago"; if(s<86400) return Math.round(s/3600)+" h ago"; const d=Math.round(s/86400); return d<14?d+" day"+(d>1?"s":"")+" ago":new Date(t).toLocaleDateString(); }
function worst(items,kind,n){ return Object.entries(items||{}).filter(([k,v])=>k[0]===kind&&v&&v.w>0).map(([k,v])=>({id:k.slice(2),r:+v.r||0,w:+v.w||0})).map(x=>Object.assign(x,{n:x.r+x.w,rate:x.w/(x.r+x.w)}))
  .sort((a,b)=>(b.n>=3)-(a.n>=3)||b.rate-a.rate||b.w-a.w||a.id.localeCompare(b.id)).slice(0,n); }
function worstHtml(list){ return list.length?'<div class="worst">'+list.map(x=>'<span><b>'+esc(x.id)+'</b>'+Math.round(x.rate*100)+'% missed ('+x.w+'/'+x.n+')</span>').join("")+'</div>':'<p class="muted">Nothing missed yet</p>'; }
function render(devs){
  const sum=S.summary(devs), wk=lastDays(7), today=dayKey(Date.now()), t=sum.total;
  const max=Math.max(1,...wk.map(k=>+t.days[k]||0)), DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const hasDeleted=sum.players.some(p=>!p.alive);
  $("total").innerHTML='<div class="sub">Total time played by everyone</div><div class="big" id="totalHM">'+hm(t.total)+'</div><div class="sub">hours:minutes'+(hasDeleted?' · includes deleted players':'')+'</div>'+
    '<div class="row3"><div>Today<b id="todayHM">'+hm(+t.days[today]||0)+'</b></div><div>Last 7 days<b id="weekHM">'+hm(sumDays(t,wk))+'</b></div><div>Players<b>'+sum.players.filter(p=>p.alive).length+'</b></div></div>'+
    '<div class="week">'+wk.map(k=>{ const v=+t.days[k]||0, d=new Date(k+"T12:00:00"); return '<div title="'+k+'">'+(v?Math.round(v/60000)+'m':'')+'<i style="height:'+Math.round(v/max*60)+'px"></i>'+DN[d.getDay()]+'</div>'; }).join("")+'</div>';
  const out=$("players"); out.innerHTML="";
  for(const p of sum.players){ const c=document.createElement("div"); c.className="card pl"; c.dataset.name=p.name; c.dataset.total=p.time.total; c.dataset.devices=p.devices; c.dataset.alive=p.alive?1:0;
    let best=""; for(const g in GAMES){ const v=+p.best[g]||0; best+='<tr data-g="'+g+'"><td>'+GAMES[g]+'</td><td class="v">⭐ '+v+'</td></tr>'; }
    const dev=p.perDevice.map(d=>'<tr><td>'+esc(d.label||"Device")+' <span class="muted">#'+esc(d.dev.slice(0,4))+(d.deleted?' · deleted there':'')+'</span></td><td class="v">'+hm(d.total)+'</td><td class="v muted">'+ago(d.last)+'</td></tr>').join("");
    c.innerHTML='<h2>'+esc(p.name)+(p.alive?'':' <span class="tag">deleted '+(p.deletedAt?new Date(p.deletedAt).toLocaleDateString():'')+'</span>')+' <small>'+(p.devices?'played on '+p.devices+' device'+(p.devices===1?'':'s'):'not played yet')+'</small></h2>'+
      '<div class="kv"><span>Played <b class="hTotal">'+hmWords(p.time.total)+'</b></span><span>Last 7 days <b>'+hmWords(sumDays(p.time,wk))+'</b></span><span>Today <b>'+hmWords(+p.time.days[today]||0)+'</b></span><span>Last played <b>'+ago(p.time.last)+'</b></span></div>'+
      '<h3>High scores</h3>'+(Object.keys(GAMES).some(g=>+p.best[g]>0)?'<div class="worst hs">'+Object.keys(GAMES).filter(g=>+p.best[g]>0).map(g=>'<span>'+GAMES[g]+' <b>⭐ '+(+p.best[g])+'</b></span>').join("")+'</div>':'<p class="muted">None yet</p>')+'<h3>Worst letters</h3>'+worstHtml(worst(p.prog.items,"L",5))+'<h3>Worst numbers</h3>'+worstHtml(worst(p.prog.items,"N",5))+
      '<details><summary>All high scores</summary><table>'+best+'</table></details><details><summary>Devices</summary><table>'+dev+'</table></details>';
    out.appendChild(c); }
  if(!sum.players.length) out.innerHTML='<div class="card muted">No players synced yet. Link a device in the app: Settings ▸ ☁️ Family sync.</div>';
  $("devices").innerHTML='<h3>Linked devices ('+sum.devices+')</h3><table>'+Object.entries(devs||{}).sort((a,b)=>(b[1].seen||0)-(a[1].seen||0)).map(([k,d])=>'<tr><td>'+esc(d.label||"Device")+' <span class="muted">#'+esc(k.slice(0,4))+'</span></td><td class="v muted">synced '+ago(d.seen)+'</td></tr>').join("")+'</table>';
  $("upd").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+" · refreshes every minute";
  window.__dash=sum; }
let busy=false;
async function load(){ if(busy) return; busy=true;
  try{ const devs=await S.getAll(); $("setup").hidden=true; $("dash").hidden=false; render(devs); }
  catch(e){ if(e.denied){ await S.checkLinked().catch(()=>{}); if(!S.status().linked) return showSetup(); } $("upd").textContent="Couldn't refresh (offline?) · "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
  finally{ busy=false; } }
let has=null;
async function showSetup(){ $("dash").hidden=true; $("setup").hidden=false; $("msg").textContent="";
  try{ has=await S.hasPassword(); }catch(e){ $("msg").textContent="No internet connection right now."; }
  $("pw2").hidden=has!==false; $("go").textContent=has===false?"Create password + open":"Open";
  $("setupText").textContent=has===false?"Make up a family sync password (6+ characters). You'll type it once on each device you link, and here.":"Type the family sync password (the one used in the app under Settings ▸ ☁️ Family sync)."; }
$("go").addEventListener("click",async()=>{ const a=$("pw").value, b=$("pw2").value; if(has===false&&a!==b){ $("msg").textContent="The two passwords don't match."; return; }
  $("msg").textContent="Checking…";
  try{ await S.link(a,has===false); $("pw").value=$("pw2").value=""; load(); }
  catch(e){ $("msg").textContent=e.short?"Use at least 6 characters.":e.wrong?"That's not the family sync password.":e.exists?"A password already exists: type that one.":"Couldn't reach the internet."; if(e.exists){ has=true; $("pw2").hidden=true; } } });
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter"&&$("pw2").hidden) $("go").click(); });
$("refresh").addEventListener("click",()=>{ if(S&&S.status().linked) load(); });
if(!S||!S.ON){ $("off").hidden=false; $("refresh").hidden=true; }
else if(S.status().linked) load(); else showSetup();
setInterval(()=>{ if(S&&S.ON&&S.status().linked&&!document.hidden) load(); },60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&S&&S.ON&&S.status().linked) load(); });
</script>
</body>
</html>
