<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Letter Fun</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letters">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff8e7">
<style>
  html,body{touch-action:manipulation;-webkit-touch-callout:none;margin:0;height:100%;font-family:"Comic Sans MS","Chalkboard SE",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#fff8e7}
  #wrap{display:flex;flex-direction:column;height:100%}
  #top{text-align:center;font-size:22px;color:#777;padding:10px}
  #letterBox{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #letter{font-size:min(45vh,60vw);line-height:1;font-weight:bold;transition:transform .15s}
  #letter.pop{transform:scale(1.15)}
  #buttons{display:flex;gap:20px;padding:20px;flex:none}
  button{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;flex:1;height:15vh;border:none;border-radius:30px;font-size:60px;color:#fff;cursor:pointer}
  #green{background:linear-gradient(to top,#1e8449 var(--p,0%),#2ecc71 var(--p,0%))}#red{background:linear-gradient(to top,#a93226 var(--p,0%),#e74c3c var(--p,0%))}
  button:active{transform:scale(.96)}
  #done{display:none;position:fixed;inset:0;background:#2ecc71;color:#fff;font-size:12vw;align-items:center;justify-content:center;text-align:center}
  /* screens */
  .screen{display:none;position:fixed;inset:0;flex-direction:column;background:#fff8e7;box-sizing:border-box}
  .screen.on{display:flex}
  .screen:not(.on){display:none !important}
  #wrap #top{min-height:64px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:10px 80px}
  #wrap.screen{position:fixed}
  #home{align-items:center;justify-content:center;gap:4vmin;padding:4vmin}
  #home h1{margin:0;font-size:min(13vw,12vh);color:#e76f51;text-align:center;line-height:1.1}
  #home h1 span:nth-child(2){color:#2a9d8f}
  .homeRow{display:grid;grid-template-columns:repeat(4,1fr);gap:3vmin;width:100%;max-width:1400px}
  button.big{flex:none;width:min(80vw,440px);height:min(24vh,220px);font-size:min(11vw,9vh,84px);border-radius:40px;box-shadow:0 1vmin 0 rgba(0,0,0,.18);touch-action:manipulation}
  .homeRow button.big{width:100%;height:min(46vh,300px);font-size:min(3.6vw,7vh,46px);line-height:1.1;padding:0 1vmin;font-family:inherit;font-weight:bold}
  @media (orientation:portrait){.homeRow{grid-template-columns:1fr 1fr;max-width:720px}.homeRow button.big{height:min(25vh,280px);font-size:min(6.2vw,4.4vh,48px)}}
  #goPractice{background:#2ecc71}#goUpper{background:#3a86ff}#goLower{background:#8e44ad}#goDraw{background:#e76f51}
  button#gear{position:absolute;top:12px;right:12px;flex:none;width:58px;height:58px;padding:0;border-radius:50%;font-size:30px;line-height:58px;color:#fff;background:conic-gradient(#e76f51 var(--p,0%),#c9bfae var(--p,0%));opacity:.75;touch-action:none}
  /* settings (problem letters) */
  #settings{align-items:center;gap:2vmin;padding:3vmin}
  #settings h2{margin:0;font-size:min(8vw,6vh,52px);color:#e76f51}
  #settings .hint{margin:0;font-size:min(4.5vw,3vh,26px);color:#777;text-align:center}
  #pGrid{flex:1;min-height:0;width:100%;max-width:1200px;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vmin}
  @media (orientation:landscape){#pGrid{grid-template-columns:repeat(9,1fr)}}
  button.pl{flex:none;width:100%;height:100%;min-height:0;padding:0;border-radius:2.5vmin;background:#fff;border:.6vmin solid #e0d6c2;color:#444;font-family:inherit;font-weight:bold;font-size:min(7vw,5vh,56px);touch-action:manipulation}
  @media (orientation:landscape){button.pl{font-size:min(4.5vw,7vh,56px)}}
  button.pl.on{background:#e76f51;border-color:#b5523a;color:#fff}
  #pBtns{display:flex;gap:4vmin;flex:none}
  #pBtns button.big{width:min(40vw,320px);height:min(11vh,110px);font-size:min(6vw,5vh,44px);font-family:inherit;font-weight:bold}
  #pClear{background:#999}#pDone{background:#2ecc71}
  #cRow{display:flex;align-items:center;gap:1.6vmin;flex:none;flex-wrap:wrap;justify-content:center}
  #cRow span{font-size:min(4.8vw,3.4vh,28px);color:#555;font-weight:bold}
  #opts{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;flex:none}
  @media (orientation:landscape){#opts{flex-direction:row;gap:5vmin}}
  #vRow{display:flex;align-items:center;gap:1.6vmin;flex:none;flex-wrap:wrap;justify-content:center}
  #vRow span{font-size:min(4.8vw,3.4vh,28px);color:#555;font-weight:bold}
  @media (max-width:500px){#cRow span,#vRow span{flex-basis:100%;text-align:center}}
  button.vs{flex:none;width:auto;height:max(36px,min(11vw,7vh,56px));padding:0 min(2.6vw,18px);border-radius:2vmin;background:#fff;border:.5vmin solid #e0d6c2;color:#444;font-family:inherit;font-weight:bold;font-size:min(5vw,3.6vh,28px);touch-action:manipulation;white-space:nowrap}
  button.vs.on{background:#8e44ad;border-color:#6c3483;color:#fff}
  button.cn{flex:none;width:max(44px,min(15vw,9vh,76px));height:max(36px,min(11vw,7vh,56px));padding:0;border-radius:2vmin;background:#fff;border:.5vmin solid #e0d6c2;color:#444;font-family:inherit;font-weight:bold;font-size:min(6vw,4vh,32px);touch-action:manipulation}
  button.cn.on{background:#3a86ff;border-color:#2a64c0;color:#fff}
  /* draw mode */
  #draw{padding:10px 12px 12px}
  #dTop{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 8px 0 80px;box-sizing:border-box;flex:none;flex-wrap:wrap}
  button.pill{flex:none;height:52px;padding:0 18px;border-radius:26px;font-size:min(5.5vw,26px);font-family:inherit;font-weight:bold;background:#3a86ff;touch-action:manipulation}
  #dOutline{background:#2a9d8f}#dOutline.off{background:#999}
  #dStage{flex:1;min-height:0;position:relative;margin:8px 0 10px;background:#fff;border-radius:4vmin;border:.8vmin solid #e0d6c2;overflow:hidden;touch-action:none}
  #dStage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
  #dYay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(40vw,40vh);pointer-events:none;opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s;background:rgba(46,204,113,.18)}
  #dYay.on{opacity:1;transform:scale(1)}
  #dBtns{display:flex;gap:2.5vmin;flex:none}
  #dBtns button{height:min(12vh,110px);font-size:min(7vw,6vh,50px);border-radius:30px;touch-action:manipulation;font-family:inherit;font-weight:bold}
  #dClear{background:#f4a261}#dSay{background:#8e44ad;flex:.7}#dDone{background:#2ecc71}#dSkip{background:#3a86ff;flex:.7}
  @media (max-width:600px){#dBtns .w{display:none}}
  button.big .ico{display:block;font-size:.8em;line-height:1}
  .homeRow button.big .ico{font-size:1.5em;margin-bottom:.1em}
  button.homeBtn{position:absolute;top:10px;left:10px;flex:none;width:64px;height:64px;border-radius:20px;font-size:36px;background:#f4a261;color:#fff;z-index:5;touch-action:manipulation;padding:0;line-height:64px}
  /* test mode */
  #test{padding:10px 12px 14px}
  #tTop{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 6px 0 84px;box-sizing:border-box;flex:none;gap:12px}
  .count{font-size:min(13vw,9vh,88px);font-weight:bold;line-height:1;font-variant-numeric:tabular-nums;min-width:1.2em}
  #tGood{color:#27ae60;text-align:left}#tBad{color:#e74c3c;text-align:right}
  /* wide screens: the replay button sits between the counters, leaving more room for the letters */
  @media (min-aspect-ratio:13/10){#tPrompt{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:0;z-index:4}
    #test #tPrompt button#speaker{height:56px;width:min(24vw,190px);font-size:34px}.count{font-size:min(9vw,13vh,80px)}}
  #tPrompt{display:flex;align-items:center;justify-content:center;flex:none;padding:1vh 0}
  button#speaker{flex:none;width:min(40vw,26vh,240px);height:min(20vw,13vh,120px);border-radius:999px;background:#8e44ad;font-size:min(12vw,8vh,72px);box-shadow:0 .8vmin 0 rgba(0,0,0,.18);touch-action:manipulation}
  #choices{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2vmin;padding:1vmin;box-sizing:border-box}
  button.choice{flex:none;width:100%;height:100%;min-height:0;min-width:0;background:#fff;border:.8vmin solid #e0d6c2;border-radius:4vmin;font-weight:bold;line-height:1;touch-action:manipulation;overflow:hidden;font-family:inherit;padding:0}
  #choices button.choice{font-size:var(--fs,min(28vw,26vh))}
  button.choice.right{background:#2ecc71;border-color:#1e8449;color:#fff !important}
  button.choice.wrong{background:#e74c3c;border-color:#a93226;color:#fff !important;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4vmin)}40%{transform:translateX(4vmin)}60%{transform:translateX(-3vmin)}80%{transform:translateX(3vmin)}}
  #tFlash{position:fixed;inset:0;background:#2ecc71;opacity:0;pointer-events:none;transition:opacity .15s}
  #tFlash.on{opacity:.45}
</style>
</head>
<body>
<div id="home" class="screen on">
  <button id="gear" aria-label="Settings (press and hold)">⚙️</button>
  <h1><span>Letter</span> <span>Fun</span></h1>
  <div class="homeRow">
    <button id="goPractice" class="big"><span class="ico">🔤</span>Practice</button>
    <button id="goUpper" class="big"><span class="ico">ABC</span>Uppercase Test</button>
    <button id="goLower" class="big"><span class="ico">abc</span>Lowercase Test</button>
    <button id="goDraw" class="big"><span class="ico">✏️</span>Draw</button>
  </div>
</div>
<div id="settings" class="screen">
  <h2>Problem letters</h2>
  <p class="hint">Tap the letters that need extra practice</p>
  <div id="pGrid"></div>
  <div id="opts">
    <div id="cRow"><span>Choices in tests:</span><button class="cn" data-n="4">4</button><button class="cn" data-n="6">6</button><button class="cn" data-n="8">8</button><button class="cn" data-n="10">10</button></div>
    <div id="vRow"><span>Voice speed:</span><button class="vs" data-v="slow">🐢 Slow</button><button class="vs" data-v="normal">Normal</button><button class="vs" data-v="fast">🐇 Fast</button></div>
  </div>
  <div id="pBtns">
    <button id="pClear" class="big">Clear all</button>
    <button id="pDone" class="big">Done</button>
  </div>
</div>
<div id="draw" class="screen">
  <button class="homeBtn" aria-label="Home">🏠</button>
  <div id="dTop">
    <button id="dCase" class="pill">ABC</button>
    <button id="dOutline" class="pill">Outline ON</button>
  </div>
  <div id="dStage"><canvas id="dGuide"></canvas><canvas id="dInk"></canvas><div id="dYay">🌟</div></div>
  <div id="dBtns">
    <button id="dClear">Clear</button>
    <button id="dSay" aria-label="Hear it again">🔊</button>
    <button id="dDone"><span class="w">Done </span>✔</button>
    <button id="dSkip" aria-label="Skip">➡</button>
  </div>
</div>
<div id="wrap" class="screen">
  <button class="homeBtn" aria-label="Home">🏠</button>
  <div id="top"></div>
  <div id="letterBox"><div id="letter"></div></div>
  <div id="buttons">
    <button id="red">✗</button>
    <button id="green">✓</button>
  </div>
</div>
<div id="test" class="screen">
  <button class="homeBtn" aria-label="Home">🏠</button>
  <div id="tTop"><span id="tGood" class="count" aria-label="Right">0</span><span id="tBad" class="count" aria-label="Wrong">0</span></div>
  <div id="tPrompt"><button id="speaker" aria-label="Hear it again">🔊</button></div>
  <div id="choices"></div>
  <div id="tFlash"></div>
</div>
<div id="done">🎉 All green! 🎉</div>
<script>
// letter name (speech), then its phonics sound (recorded clip in sounds/)
const LETTERS="abcdefghijklmnopqrstuvwxyz".split("");
function safe(fn,...a){ try{ return fn(...a); }catch(e){ try{console.error(e);}catch(_){} } }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
// "problem letters" (lowercase keys), chosen by a grown-up in the hidden settings screen
const PROB_KEY="lf-problem";
let problems=new Set((Array.isArray(lsGet(PROB_KEY,[]))?lsGet(PROB_KEY,[]):[]).filter(l=>LETTERS.includes(l)));
function saveProblems(){ lsSet(PROB_KEY,[...problems].sort()); }
// voice speed: speech rate + recorded clip playback rate (pitch preserved)
const VOICE_KEY="lf-voice", SPEEDS={slow:{tts:0.5,clip:0.75,wait:1.4},normal:{tts:0.75,clip:1.0,wait:1},fast:{tts:1.0,clip:1.15,wait:0.9}};
let voiceSpeed=SPEEDS[lsGet(VOICE_KEY,"normal")]?lsGet(VOICE_KEY,"normal"):"normal";
function spd(){ return SPEEDS[voiceSpeed]||SPEEDS.normal; }
// number of answer choices in the tests (4 / 6 / 8 / 10)
const CHOICES_KEY="lf-choices", CHOICE_OPTS=[4,6,8,10];
let nChoices=CHOICE_OPTS.includes(lsGet(CHOICES_KEY,4))?lsGet(CHOICES_KEY,4):4;

// ---------- speech (iOS Safari-hardened; the game never waits on it) ----------
const synth=("speechSynthesis" in window && window.speechSynthesis) ? window.speechSynthesis : null;
let voice=null, speakT=null, speechWatchT=null, lastUtter=null, cancelAt=0, spokeOnce=false;
function pickVoice(){
  if(!synth) return;
  const vs=(synth.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
  const prefs=["Samantha","Ava","Allison","Susan","Zoe","Nicky","Aria","Jenny","Michelle","Google US English","Karen","Moira","Tessa","Serena","Victoria","Zira","female"];
  for(const n of prefs){const v=vs.find(v=>v.name.toLowerCase().includes(n.toLowerCase()));if(v){voice=v;return;}}
  voice=vs[0]||null;
}
safe(pickVoice); if(synth) safe(()=>{ synth.onvoiceschanged=()=>safe(pickVoice); });
// Stop speech. Returns true if something was actually speaking/queued.
function hush(){
  clearTimeout(speakT); speakT=null; clearTimeout(speechWatchT); speechWatchT=null;
  if(!synth) return false;
  let busy=false;
  try{ busy=!!(synth.speaking||synth.pending); if(busy){ synth.cancel(); cancelAt=Date.now(); } if(synth.paused) synth.resume(); }catch(e){}
  return busy;
}
function speak(text){
  if(!synth||typeof SpeechSynthesisUtterance==="undefined") return;
  const justCancelled=hush()||Date.now()-cancelAt<150;
  const go=()=>{ speakT=null; try{
    const u=new SpeechSynthesisUtterance(text);
    if(voice) u.voice=voice;
    u.rate=spd().tts; u.pitch=1.3; u.volume=0.9; u.lang="en-US";
    spokeOnce=true; lastUtter=u; // keep a reference: Safari drops end events for garbage-collected utterances
    u.onend=u.onerror=()=>{ if(lastUtter===u){ lastUtter=null; clearTimeout(speechWatchT); speechWatchT=null; } };
    if(synth.paused) synth.resume(); // iOS can come back from the background "paused"
    synth.speak(u);
    // watchdog: our phrases are short; if the engine is still "speaking" long after, it is wedged -> reset it
    speechWatchT=setTimeout(()=>{ speechWatchT=null; try{ if(lastUtter===u&&(synth.speaking||synth.pending)){ synth.cancel(); } }catch(e){} lastUtter=null; },Math.round(9000*spd().wait));
  }catch(e){} };
  // Safari often swallows an utterance spoken immediately after cancel(); give it a moment.
  // (Only delay once speech has been unlocked by an earlier direct call; iOS needs the first speak() inside a tap.)
  if(justCancelled&&spokeOnce) speakT=setTimeout(go,120); else go();
}

// ---------- phonics clips (created on first use, not 26 up front) ----------
const CLIPS={}; let clip=null;
function getClip(l){ if(!CLIPS[l]){ const a=new Audio("sounds/"+l+".mp3"); a.preload="auto"; CLIPS[l]=a; } return CLIPS[l]; }
function stopClip(){ if(clip){ try{clip.pause(); clip.currentTime=0;}catch(e){} clip=null; } }
function playSound(l){
  hush(); stopClip();
  try{
    clip=getClip(l);
    try{clip.currentTime=0;}catch(e){}
    try{ clip.preservesPitch=true; clip.webkitPreservesPitch=true; clip.mozPreservesPitch=true;
      clip.defaultPlaybackRate=spd().clip; clip.playbackRate=spd().clip; }catch(e){}
    const p=clip.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){ clip=null; }
}
function quiet(){ hush(); stopClip(); }

// ---------- reliable taps ----------
// Act on touchend (a user gesture on iOS, so audio/speech still unlock). iOS suppresses "click" when a second
// finger/thumb is on the screen and when the finger drifts a bit; kids do both. preventDefault on touchend also
// stops the delayed native click from landing on the *next* screen (ghost taps). click stays as mouse/keyboard fallback.
let lastTapT=0;
function onTap(el,fn){
  const ids=new Set();
  el.addEventListener("touchstart",e=>{ for(const t of e.changedTouches) ids.add(t.identifier); },{passive:true});
  el.addEventListener("touchcancel",e=>{ for(const t of e.changedTouches) ids.delete(t.identifier); },{passive:true});
  el.addEventListener("touchend",e=>{
    for(const t of e.changedTouches){
      if(!ids.has(t.identifier)) continue; ids.delete(t.identifier);
      const r=el.getBoundingClientRect(), m=40;
      if(r.width&&t.clientX>=r.left-m&&t.clientX<=r.right+m&&t.clientY>=r.top-m&&t.clientY<=r.bottom+m){
        if(e.cancelable) e.preventDefault();
        lastTapT=Date.now(); safe(fn,e); return;
      }
    }
  },{passive:false});
  el.addEventListener("click",e=>{ if(Date.now()-lastTapT<700) return; safe(fn,e); });
}

const colors=["#e63946","#2a9d8f","#f4a261","#457b9d","#8e44ad","#e76f51","#27ae60","#d81b60"];
const el=document.getElementById("letter"), top_=document.getElementById("top"), doneEl=document.getElementById("done");
let taps=0;
let queue=[], reds=[], current=null, total=0, greens=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// break up identical neighbours (bounded number of passes, never loops forever)
function spread(a){
  for(let pass=0;pass<6;pass++){
    let ok=true;
    for(let i=1;i<a.length;i++){
      if(a[i]!==a[i-1]) continue; ok=false;
      for(let k=0;k<a.length;k++){ const j=Math.floor(Math.random()*a.length); if(a[j]!==a[i]&&a[j-1]!==a[i]&&a[j+1]!==a[i]){ [a[i],a[j]]=[a[j],a[i]]; break; } }
    }
    if(ok) break;
  }
  return a;
}
// every letter in both cases once; problem letters (both cases) 3 times
function buildDeck(){
  const d=[];
  LETTERS.forEach(l=>{ const n=problems.has(l)?3:1; for(let i=0;i<n;i++) d.push(l,l.toUpperCase()); });
  return spread(shuffle(d));
}
function startRound(){
  queue=buildDeck();
  reds=[]; total=queue.length; greens=0; next();
}
function next(){
  if(queue.length===0){
    if(reds.length===0){ celebrate(); return; }
    queue=shuffle(reds); reds=[];
  }
  current=queue.shift(); taps=0;
  el.textContent=current;
  el.style.color=colors[Math.floor(Math.random()*colors.length)];
  top_.textContent="Green: "+greens+" of "+total;
  quiet();
}
function say(){
  if(mode!=="practice"||!current||celebrating()) return;
  const l=current.toLowerCase();
  taps++;
  if(taps%2===1) speak(l.toUpperCase()+".");
  else playSound(l);
  el.classList.add("pop"); setTimeout(()=>el.classList.remove("pop"),150);
}
let celebrateT=null, celebrateAt=0;
function celebrating(){ return doneEl.style.display==="flex"; }
function endCelebration(restart){
  clearTimeout(celebrateT); celebrateT=null; celebrateAt=0;
  doneEl.style.display="none";
  if(restart&&mode==="practice") startRound();
}
function celebrate(){
  doneEl.style.display="flex"; celebrateAt=Date.now();
  // schedule the exit BEFORE speaking, so a speech failure can never leave the overlay up
  clearTimeout(celebrateT); celebrateT=setTimeout(()=>endCelebration(true),4000);
  quiet(); speak("Great job! You got them all!");
}
// tapping the celebration screen (after a moment) skips it, so it can never trap the kids
onTap(doneEl,()=>{ if(Date.now()-celebrateAt>1200) endCelebration(true); });
onTap(document.getElementById("letterBox"),say);
const HOLD_MS=1000;
function holdButton(id,action,guard){
  guard=guard||(()=>mode==="practice"&&!celebrating());
  const b=document.getElementById(id); let t=null,start=0,raf=null;
  const reset=()=>{clearTimeout(t);cancelAnimationFrame(raf);t=null;b.style.setProperty("--p","0%");};
  const tick=()=>{if(!t)return;const p=Math.min(100,(Date.now()-start)/HOLD_MS*100);b.style.setProperty("--p",p+"%");raf=requestAnimationFrame(tick);};

  const step=()=>{ if(gen!==warmGen||mode!=="draw") return; const {S,w,h}=evalGrid(); for(let k=0;k<3&&todo.length;k++) safe(glyphData,todo.shift(),w,h,S); if(todo.length) setTimeout(step,15); };
  setTimeout(step,300);
}
function countParts(M,w,h){ // separate pieces (the i and j dots)
  const lab=new Uint8Array(w*h); let n=0;
  for(let s=0;s<w*h;s++){ if(!M[s]||lab[s]) continue; n++; lab[s]=1; const st=[s];
    while(st.length){ const i=st.pop(), x=i%w, y=(i-x)/w;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const X=x+dx, Y=y+dy; if(X<0||Y<0||X>=w||Y>=h) continue; const j=Y*w+X; if(M[j]&&!lab[j]){ lab[j]=1; st.push(j); } } } }
  return n;
}
function inkData(pts,w,h,S){
  let len=0; for(const s of pts){ if(s.p.length<2){ len+=dLine; continue; } for(let i=1;i<s.p.length;i++) len+=Math.hypot(s.p[i][0]-s.p[i-1][0],s.p[i][1]-s.p[i-1][1]); }
  const I=maskOf(c=>{ for(const s of pts) strokePath(c,s,dLine); },w,h,S);
  let iN=0; for(let i=0;i<w*h;i++) iN+=I[i];
  const iIdx=new Int32Array(iN); for(let i=0,j=0;i<w*h;i++) if(I[i]) iIdx[j++]=i;
  return {iIdx,iN,len,dInk:iN?chamfer(I,w,h):null,parts:countParts(I,w,h)};
}
function normalizeFor(g,strks,S,rule){ // from memory: move/scale the drawing's box onto the letter's centre-line box
  const [kx0,ky0,kx1,ky1]=g.kbox;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of strks) for(const [x,y] of s.p){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const bx0=(kx0+.5)/S, bx1=(kx1+.5)/S, by0=(ky0+.5)/S, by1=(ky1+.5)/S;
  let tw=bx1-bx0, th=by1-by0; const tbig=Math.max(tw,th,1); tw=Math.max(tw,tbig*0.12); th=Math.max(th,tbig*0.12);
  let iw=x1-x0, ih=y1-y0; const big=Math.max(iw,ih,1); iw=Math.max(iw,big*0.12); ih=Math.max(ih,big*0.12);
  // size comes from the letter's long side; the other side may stretch at most "aspect" (so a wide drawing can't pass as a thin letter)
  let sx=tw/iw, sy=th/ih; const ar=rule.aspect||1.4;
  if(th>=tw) sx=Math.min(Math.max(sx,sy/ar),sy*ar); else sy=Math.min(Math.max(sy,sx/ar),sx*ar);
  const cx=(x0+x1)/2, cy=(y0+y1)/2, tx=(bx0+bx1)/2, ty=(by0+by1)/2;
  return strks.map(s=>({c:s.c,p:s.p.map(([x,y])=>[tx+(x-cx)*sx, ty+(y-cy)*sy])}));
}
// score one drawing against one character (ink = drawing already placed in the stage)
function scoreInk(ch,rule,ink,grid){
  const {S,w,h}=grid, res={ch,pass:false,coverage:0,precision:0,len:0,f1:0};
  const g=glyphData(ch,w,h,S); if(!g.gN||!g.kN||!ink.iN) return res;
  const tolCov=rule.covTol*g.Hg, tolPrec=rule.precTol*g.Hg;
  let cov=0,prec=0,dc=0,dp=0;
  for(const i of g.kIdx){ const d=ink.dInk[i]; if(d<=tolCov) cov++; dc+=Math.min(d,g.Hg); }
  for(const i of ink.iIdx){ if(g.dGl[i]<=tolPrec) prec++; dp+=Math.min(g.dK[i],g.Hg); }
  res.coverage=cov/g.kN; res.precision=prec/ink.iN; res.len=ink.len*S/g.kN;
  res.f1=(res.coverage+res.precision)?2*res.coverage*res.precision/(res.coverage+res.precision):0;
  // for ranking letters against each other: f1 saturates at 1 for close letters, so also count how far the drawing
  // strays from each letter's centre line, and whether it has the right number of separate pieces (the i / j dot)
  res.score=res.f1-(dc/g.kN+dp/ink.iN)/g.Hg-(ink.parts===g.parts?0:0.03);
  res.pass=res.coverage>=rule.cov&&res.precision>=rule.prec&&res.len<=rule.len&&res.len>=(rule.minLen||0);
  return res;
}
// ink for comparing with `ch`: as drawn (outline on) or moved/scaled onto ch's box (from memory)
function inkFor(ch,outlineOn,strks,grid){
  const {S,w,h}=grid; if(outlineOn) return inkData(strks,w,h,S);
  return inkData(normalizeFor(glyphData(ch,w,h,S),strks,S,DRAW_RULES.off),w,h,S);
}
function scoreAgainst(ch,outlineOn,strks,grid){ return scoreInk(ch,outlineOn?DRAW_RULES.on:DRAW_RULES.off,inkFor(ch,outlineOn,strks,grid),grid); }
// letters whose two cases look alike once fitted to the drawing area (so either case is fine)
function sameShapeOk(ch){
  if(SAME_CASE_OK.includes(ch.toLowerCase())) return true;
  if(!sameShapeCache){
    sameShapeCache=new Set(); const grid=evalGrid();
    for(const l of LETTERS){ const U=l.toUpperCase(); let ok=true;
      for(const [a,b] of [[l,U],[U,l]]){ const ga=glyphData(a,grid.w,grid.h,grid.S);
        const tr=glyphPaths(ga.lay,120).filter(p=>p.length>=1).map(p=>({c:"#000",p}));
        if(!tr.length||scoreAgainst(b,true,tr,grid).f1<0.93){ ok=false; break; } }
      if(ok) sameShapeCache.add(l); }
  }
  return sameShapeCache.has(ch.toLowerCase());
}
function evalDrawing(outlineOn, strks){
  strks=strks||strokes;
  const empty={pass:false,coverage:0,precision:0,len:0,f1:0};
  if(!dGlyph||!strks.length) return empty;
  const grid=evalGrid(), ch=dChar(), other=ch===ch.toUpperCase()?ch.toLowerCase():ch.toUpperCase();
  const rule=outlineOn?DRAW_RULES.on:DRAW_RULES.off;
  const ok=[ch,...(ALT[ch]||"")]; if(sameShapeOk(ch)) ok.push(other);
  const raw=inkData(strks,grid.w,grid.h,grid.S);
  const sc=c=>{ const ink=outlineOn?raw:inkFor(c,false,strks,grid); ink.parts=raw.parts; return scoreInk(c,rule,ink,grid); };
  let res=null;
  for(const a of ok){ const r=sc(a); if(!res||(r.pass&&!res.pass)||(r.pass===res.pass&&r.score>res.score)) res=r; }
  res.ch=ch;
  if(!res.pass) return res;
  // It must look at least as much like the requested letter as like ANY other letter, upper or lower case (F drawn for e, O for C...)
  let rival=null;
  for(const c of ALL52){ if(ok.includes(c)) continue; const r=sc(c); if(!rival||r.score>rival.score) rival=r; }
  res.rival=rival.ch; res.rivalScore=rival.score; res.gap=res.score-rival.score;
  if(res.gap<DRAW_RULES.margin){ res.pass=false; res.lookalike=rival.ch; }
  return res;
}
function drawSuccess(){
  dPassed=true; dPassedAt=Date.now(); dActive.clear(); clearTimeout(dCheckT); dCheckT=null;
  clearTimeout(dNextT); dNextT=setTimeout(nextDraw,Math.round(1700*spd().wait)); // schedule first: nothing can leave us stuck here
  dYay.classList.add("on"); speak("Yes! Great job!");
}
function checkDrawing(fromDone){
  if(mode!=="draw"||dPassed||!strokes.length){ if(fromDone&&mode==="draw"&&!dPassed) drawPrompt(); return; }
  const r=evalDrawing(dOutline); window.__lastEval=r;
  if(r.pass) return drawSuccess();
  if(!fromDone) return; // on finger lift we only ever say "yes" - they may still be drawing
  const rule=dOutline?DRAW_RULES.on:DRAW_RULES.off;
  if(r.lookalike||r.precision<rule.prec||r.len>rule.len){ speak("Oops! Let's try again."); clearInk(); } // mostly off the letter / scribbled
  else speak("Keep going!"); // on the letter, just not finished
}
// --- finger / mouse drawing ---
function stagePt(e){ const r=inkC.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
function beginStroke(key,pt){ if(mode!=="draw"||dPassed) return; clearTimeout(dCheckT); dCheckT=null;
  const s={c:INK[inkN++%INK.length],p:[pt]}; strokes.push(s); dActive.set(key,s); ictx.fillStyle=s.c; strokePath(ictx,s,dLine); }
function moveStroke(key,pt){ const s=dActive.get(key); if(!s) return; const l=s.p[s.p.length-1];
  if(Math.abs(pt[0]-l[0])+Math.abs(pt[1]-l[1])<2) return; s.p.push(pt);
  ictx.strokeStyle=s.c; ictx.lineWidth=dLine; ictx.lineCap="round"; ictx.lineJoin="round";
  ictx.beginPath(); ictx.moveTo(l[0],l[1]); ictx.lineTo(pt[0],pt[1]); ictx.stroke(); }
function endStroke(key){ if(!dActive.delete(key)) return; if(!dActive.size){ clearTimeout(dCheckT); dCheckT=setTimeout(()=>{ dCheckT=null; safe(checkDrawing,false); },250); } }
inkC.addEventListener("touchstart",e=>{ if(e.cancelable) e.preventDefault(); for(const t of e.changedTouches) beginStroke(t.identifier,stagePt(t)); },{passive:false});
inkC.addEventListener("touchmove",e=>{ if(e.cancelable) e.preventDefault(); for(const t of e.changedTouches) moveStroke(t.identifier,stagePt(t)); },{passive:false});
inkC.addEventListener("touchend",e=>{ if(e.cancelable) e.preventDefault(); for(const t of e.changedTouches) endStroke(t.identifier); },{passive:false});
inkC.addEventListener("touchcancel",e=>{ for(const t of e.changedTouches) endStroke(t.identifier); },{passive:false});
inkC.addEventListener("mousedown",e=>{ e.preventDefault(); beginStroke("m",stagePt(e)); });
window.addEventListener("mousemove",e=>{ if(dActive.has("m")) moveStroke("m",stagePt(e)); });
window.addEventListener("mouseup",()=>endStroke("m"));
inkC.addEventListener("contextmenu",e=>e.preventDefault());
onTap(document.getElementById("dClear"),()=>{ if(!dPassed) clearInk(); });
onTap(document.getElementById("dSay"),drawPrompt);
onTap(document.getElementById("dDone"),()=>checkDrawing(true));
onTap(document.getElementById("dSkip"),nextDraw);
onTap(document.getElementById("dCase"),()=>{ dCase=dCase==="upper"?"lower":"upper"; lsSet(DCASE_KEY,dCase); syncDrawToggles();
  if(mode==="draw"&&!dPassed){ layoutDraw(); drawGuide(); clearInk(); drawPrompt(); } });
onTap(document.getElementById("dOutline"),()=>{ dOutline=!dOutline; lsSet(DOUT_KEY,dOutline); syncDrawToggles(); drawGuide(); });
let resizeT=null;
window.addEventListener("resize",()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ if(mode==="test") layoutChoices(); if(mode==="draw"&&!dPassed){ layoutDraw(); drawGuide(); clearInk(); } },150); });

// ---------- safety nets ----------
// If a timer got lost (e.g. iOS suspended the app mid-celebration or mid-answer), recover instead of staying stuck.
setInterval(()=>safe(()=>{
  if(celebrating()&&celebrateAt&&Date.now()-celebrateAt>6000) endCelebration(true);
  if(mode==="test"&&tBusy&&tBusyAt&&Date.now()-tBusyAt>4000) advance();
  if(mode==="draw"&&dPassed&&dPassedAt&&Date.now()-dPassedAt>5000) nextDraw();
}),1000);
// iOS: speech/audio are often wedged after the app is backgrounded (home-screen app resumed later). Reset them.
function onResume(){ safe(()=>{ if(synth){ synth.cancel(); if(synth.paused) synth.resume(); } lastUtter=null; stopClip(); }); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) safe(quiet); else onResume(); });
window.addEventListener("pageshow",onResume);

show("home");
if("serviceWorker" in navigator) safe(()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
