<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Letter Fun</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letters">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff8e7">
<style>
  html,body{touch-action:manipulation;-webkit-touch-callout:none;margin:0;height:100%;font-family:"Comic Sans MS","Chalkboard SE",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#fff8e7}
  #wrap{display:flex;flex-direction:column;height:100%}
  #top{text-align:center;font-size:22px;color:#777;padding:10px}
  #letterBox{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #letter{font-size:min(45vh,60vw);line-height:1;font-weight:bold;transition:transform .15s}
  #letter.pop{transform:scale(1.15)}
  #buttons{display:flex;gap:20px;padding:20px;flex:none}
  button{touch-action:manipulation;flex:1;height:15vh;border:none;border-radius:30px;font-size:60px;color:#fff;cursor:pointer}
  #green{background:#2ecc71}#red{background:#e74c3c}
  button:active{transform:scale(.96)}
  #done{display:none;position:fixed;inset:0;background:#2ecc71;color:#fff;font-size:12vw;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"></div>
  <div id="letterBox"><div id="letter"></div></div>
  <div id="buttons">
    <button id="red">✗</button>
    <button id="green">✓</button>
  </div>
</div>
<div id="done">🎉 All green! 🎉</div>
<script>
// letter name, then its sound (spelled so the computer voice says it clearly)
const SOUNDS={a:"ah",b:"buh",c:"kuh",d:"duh",e:"eh",f:"fff",g:"guh",h:"hhuh",i:"ih",j:"juh",k:"kuh",l:"lll",m:"mmm",n:"nnn",o:"ahh",p:"puh",q:"kwuh",r:"rrr",s:"sss",t:"tuh",u:"uhh",v:"vvv",w:"wuh",x:"ks",y:"yuh",z:"zzz"};
const colors=["#e63946","#2a9d8f","#f4a261","#457b9d","#8e44ad","#e76f51","#27ae60","#d81b60"];
const el=document.getElementById("letter"), top_=document.getElementById("top");
let taps=0;
let queue=[], reds=[], current=null, total=0, greens=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startRound(){
  queue=shuffle("abcdefghijklmnopqrstuvwxyz".split("").map(l=>Math.random()<0.5?l.toUpperCase():l));
  reds=[]; total=queue.length; greens=0; next();
}
function next(){
  if(queue.length===0){
    if(reds.length===0){ celebrate(); return; }
    queue=shuffle(reds); reds=[];
  }
  current=queue.shift(); taps=0;
  el.textContent=current;
  el.style.color=colors[Math.floor(Math.random()*colors.length)];
  top_.textContent="Green: "+greens+" of "+total;
  speechSynthesis.cancel();
}
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const prefs=["Samantha","Ava","Allison","Susan","Zoe","Nicky","Aria","Jenny","Michelle","Google US English","Karen","Moira","Tessa","Serena","Victoria","Zira","female"];
  for(const n of prefs){const v=vs.find(v=>v.name.toLowerCase().includes(n.toLowerCase()));if(v){voice=v;return;}}
  voice=vs[0]||null;
}
pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;
function speak(text){
  const u=new SpeechSynthesisUtterance(text);
  if(voice) u.voice=voice;
  u.rate=0.75; u.pitch=1.3; u.volume=0.9; u.lang="en-US";
  speechSynthesis.speak(u);
}
function say(){
  speechSynthesis.cancel();
  const l=current.toLowerCase();
  taps++;
  if(taps%2===1) speak(l.toUpperCase()+".");
  else speak(SOUNDS[l]);
  el.classList.add("pop"); setTimeout(()=>el.classList.remove("pop"),150);
}
function celebrate(){
  const d=document.getElementById("done");
  d.style.display="flex";
  speechSynthesis.cancel(); speak("Great job! You got them all!");
  setTimeout(()=>{d.style.display="none"; startRound();},4000);
}
document.getElementById("letterBox").onclick=say;
document.getElementById("green").onclick=()=>{greens++; next();};
document.getElementById("red").onclick=()=>{reds.push(current); next();};
let lastTouch=0;
document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastTouch<350){e.preventDefault();e.target.click&&e.target.closest&&(e.target.closest("button,#letterBox")||{click(){}}).click();}lastTouch=n;},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());
startRound();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
